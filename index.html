<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قنّارة | المنيو</title><style>body{margin:0;background:#fff6eb;color:#422719;font:16px system-ui}header{background:linear-gradient(110deg,#8d3600,#f28c00);color:white;padding:38px 20px}main{max-width:900px;margin:auto;padding:16px}h1{margin:0}section{background:white;padding:18px;border-radius:18px;margin:16px 0;box-shadow:0 3px 16px #64331115}button{cursor:pointer;border:0;border-radius:10px;background:#e87900;color:white;padding:12px 17px;font-weight:bold}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #dbcaba;border-radius:9px;margin:7px 0;font:inherit}.tabs{display:flex;gap:8px;overflow:auto;padding:6px 0}.tabs button{white-space:nowrap;background:#725447}.tabs button.active{background:#e87900}.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.item img{width:78px;height:78px;object-fit:cover;border-radius:12px}.item .info{flex:1}.small{font-size:13px;color:#856d60}.cartrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eee}.cartrow button{padding:7px 12px}.total{font-size:21px;font-weight:bold;margin:16px 0}.hidden{display:none}#send{width:100%;background:#168c53;font-size:18px}</style></head><body><header><h1>قنّارة</h1><h2>الطعم الأصيل يبدأ هنا.</h2><p>اختر وجبتك وأرسل طلبك عبر واتساب</p></header><main><section><h2>قائمة الطعام</h2><div id="tabs" class="tabs"></div><div id="menu"></div></section><section><h2>🛒 سلة طلبك</h2><div id="cart"></div><label>اسم العميل *</label><input id="customer" placeholder="اسمك"><label>رقم الجوال *</label><input id="mobile" inputmode="tel" placeholder="05xxxxxxxx"><label>طريقة الاستلام</label><select id="method"><option value="delivery">توصيل إلى المنزل</option><option value="pickup">استلام من المطعم</option></select><div id="delivery"><label>الحي *</label><select id="district"></select><label>تفاصيل العنوان *</label><textarea id="address" placeholder="الشارع، رقم المنزل، أقرب معلم"></textarea></div><div class="total" id="total"></div><button id="send">إرسال الطلب عبر واتساب</button><p id="notice" class="small"></p></section></main>
<script id="qannara-data" type="application/json">{"products":[{"id":"p0","name":"حميس حاشي","price":60,"category":"اللحوم","visible":true,"image":""},{"id":"p1","name":"حاشي مضغوط","price":50,"category":"اللحوم","visible":true,"image":""},{"id":"p2","name":"حبة شواية","price":44,"category":"الدجاج","visible":true,"image":""},{"id":"p3","name":"نص شواية","price":22,"category":"الدجاج","visible":true,"image":""},{"id":"p4","name":"حبة مندي","price":44,"category":"الدجاج","visible":true,"image":""},{"id":"p5","name":"نصف مندي","price":22,"category":"الدجاج","visible":true,"image":""},{"id":"p6","name":"حبة مظبي","price":44,"category":"الدجاج","visible":true,"image":""},{"id":"p7","name":"نصف مظبي","price":22,"category":"الدجاج","visible":true,"image":""},{"id":"p8","name":"حبة مدفون","price":44,"category":"الدجاج","visible":true,"image":""},{"id":"p9","name":"نصف مدفون","price":22,"category":"الدجاج","visible":true,"image":""},{"id":"p10","name":"نفر رز حبة حائلي","price":10,"category":"الدجاج","visible":true,"image":""},{"id":"p11","name":"ملوخية","price":8,"category":"الإيدامات","visible":true,"image":""},{"id":"p12","name":"بامية","price":8,"category":"الإيدامات","visible":true,"image":""},{"id":"p13","name":"مشكل خضار","price":8,"category":"الإيدامات","visible":true,"image":""},{"id":"p14","name":"جريش","price":8,"category":"الإيدامات","visible":true,"image":""},{"id":"p15","name":"قرصان","price":8,"category":"الإيدامات","visible":true,"image":""},{"id":"p16","name":"سلطة خضراء","price":3,"category":"السلطات والمشروبات","visible":true,"image":""},{"id":"p17","name":"طحينة","price":3,"category":"السلطات والمشروبات","visible":true,"image":""},{"id":"p18","name":"شطة","price":3,"category":"السلطات والمشروبات","visible":true,"image":""},{"id":"p19","name":"بيبسي","price":3,"category":"السلطات والمشروبات","visible":true,"image":""},{"id":"p20","name":"كنافة","price":8,"category":"الحلا","visible":true,"image":""}],"districts":[{"name":"داخل حائل","fee":0}],"phone":"0583764444"}</script>
<script>
const data=JSON.parse(document.getElementById('qannara-data').textContent),products=data.products.filter(x=>x.visible!==false),cart={},$=id=>document.getElementById(id);let active='الكل';const cats=['الكل',...new Set(products.map(p=>p.category))];function money(n){return Number(n).toFixed(2).replace(/\.00$/,'')+' ريال'}function tabs(){$('tabs').innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c===active?'active':'';b.onclick=()=>{active=c;tabs();menu()};$('tabs').append(b)})}function menu(){$('menu').innerHTML='';products.filter(p=>active==='الكل'||p.category===active).forEach(p=>{let row=document.createElement('div');row.className='item';if(p.image&&/^https:\/\//.test(p.image)){let img=document.createElement('img');img.src=p.image;row.append(img)}let info=document.createElement('div');info.className='info';let strong=document.createElement('strong');strong.textContent=p.name;let price=document.createElement('p');price.textContent=money(p.price);info.append(strong,price);let b=document.createElement('button');b.textContent='أضف +';b.onclick=()=>{cart[p.id]=(cart[p.id]||0)+1;renderCart()};row.append(info,b);$('menu').append(row)})}function renderCart(){$('cart').innerHTML='';let subtotal=0;for(const [id,qty] of Object.entries(cart)){const p=products.find(x=>x.id===id);if(!p)continue;subtotal+=p.price*qty;const row=document.createElement('div');row.className='cartrow';const t=document.createElement('span');t.textContent=p.name+' × '+qty+' — '+money(p.price*qty);const less=document.createElement('button');less.textContent='−';less.onclick=()=>{if(--cart[id]<=0)delete cart[id];renderCart()};const more=document.createElement('button');more.textContent='+';more.onclick=()=>{cart[id]++;renderCart()};row.append(t,less,more);$('cart').append(row)}if(!subtotal)$('cart').textContent='السلة فارغة حاليًا';const district=data.districts[$('district').selectedIndex]||{fee:0};const fee=$('method').value==='delivery'?Number(district.fee)||0:0;$('total').textContent='الإجمالي: '+money(subtotal+fee)+(fee?' (يشمل التوصيل '+money(fee)+')':'');}data.districts.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=d.name+' — توصيل '+money(d.fee);$('district').append(o)});$('method').onchange=()=>{$('delivery').classList.toggle('hidden',$('method').value==='pickup');renderCart()};$('district').onchange=renderCart;$('send').onclick=()=>{const name=$('customer').value.trim(),mobile=$('mobile').value.trim(),lines=Object.entries(cart).filter(([id,q])=>q>0).map(([id,q])=>{const p=products.find(x=>x.id===id);return p?'- '+p.name+' × '+q+' = '+money(p.price*q):''}).filter(Boolean);if(!lines.length||!name||!/^05\d{8}$/.test(mobile)||($('method').value==='delivery'&&!$('address').value.trim())){$('notice').textContent='أكمل الاسم والجوال والعنوان واختر وجبة أولًا';return}const d=data.districts[$('district').selectedIndex]||{name:'',fee:0};const details=$('method').value==='pickup'?'استلام من المطعم':'توصيل — '+d.name+'\nالعنوان: '+$('address').value.trim()+'\nرسوم التوصيل: '+money(d.fee);const msg='طلب جديد من قنّارة\nالاسم: '+name+'\nالجوال: '+mobile+'\n'+lines.join('\n')+'\n'+details+'\n'+$('total').textContent;window.open('https://wa.me/966'+data.phone.replace(/^0/,'')+'?text='+encodeURIComponent(msg),'_blank')};tabs();menu();renderCart();
</script></body></html>
